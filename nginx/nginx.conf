events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstream active-passive disaster recovery failover pool
    upstream active_cloud_cluster {
        server aws_node:7001 max_fails=1 fail_timeout=3s;
        server azure_node:7002 backup;
    }

    server {
        listen 80;
        server_name localhost;

        # Web Dashboard UI
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Multi-Cloud Edge Failover Route
        # Automatically routes to AWS Primary. If AWS fails, Nginx reroutes to Azure Standby (backup)!
        location /cloud/ {
            proxy_pass http://active_cloud_cluster/;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # AWS Node Direct Proxy
        location /api/aws/ {
            proxy_pass http://aws_node:7001/;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        # Azure Node Direct Proxy
        location /api/azure/ {
            proxy_pass http://azure_node:7002/;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        # Cross-Cloud Sync Engine Proxy
        location /api/sync/ {
            proxy_pass http://sync_daemon:7003/api/sync/;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }
    }
}
