---
- name: Ensure Python and Nginx are installed on Azure VM
  package:
    name:
      - python3
      - python3-pip
      - curl
      - jq
    state: present

- name: Configure Azure Monitor OMS Agent
  copy:
    content: |
      # Azure Monitor Log Analytics Configuration
      WORKSPACE_ID="ae918c01-7fa3-4cb2-938b-cloudsync"
      ENABLE_PERF_METRICS="true"
      HEARTBEAT_INTERVAL="15s"
      MONITOR_NAMESPACE="CloudSync/Azure"
    dest: /etc/azure-monitor-oms.conf
    mode: '0644'

- name: Configure Azure Standby Node Service Environment
  copy:
    content: |
      CLOUD_PROVIDER=AZURE
      AZURE_REGION=eastus2
      ROLE=STANDBY
      STORAGE_CONTAINER=cloudsync-backup-vault
      AZURE_MONITOR_ENABLED=true
    dest: /etc/cloudsync-node.env
    mode: '0600'

- name: Ensure Standby Application Service is in Warm Ready State
  service:
    name: cloudsync-azure
    state: started
    enabled: yes
  ignore_errors: yes
